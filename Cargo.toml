[package]
name = "stabilizer"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native memory monitor and systemd-oomd policy manager for Ubuntu 26.04"
license-file = "LICENSE"
repository = "https://github.com/topwebmaster/stabilizer"
default-run = "stabilizer"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "signal"] }
zbus = { version = "5.18", default-features = false, features = ["tokio", "blocking-api"] }
ksni = "0.3.6"

[dependencies.gtk]
package = "gtk4"
version = "0.11"
features = ["v4_18"]
optional = true

[dependencies.adw]
package = "libadwaita"
version = "0.9"
features = ["v1_7"]
optional = true

[features]
default = ["gui"]
gui = ["dep:gtk", "dep:adw"]

[[bin]]
name = "stabilizer"
path = "src/bin/stabilizer.rs"
required-features = ["gui"]

[[bin]]
name = "stabilizer-agent"
path = "src/bin/stabilizer-agent.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = 0
